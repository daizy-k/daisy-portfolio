function Navbar({ darkMode, setDarkMode, activeSection }) {

  useEffect(() => {

    };

  }, []);

  return (

function Skills() {
  const [activeCategory, setActiveCategory] = useState("All");

  const skillsData = [
    { name: "Python", icon: "bi-filetype-py", category: "Languages", desc: "Data structures, backend scripts, automation" },
    { name: "C++", icon: "bi-code-slash", category: "Languages", desc: "Object-oriented programming, memory management" },
    { name: "React", icon: "bi-bootstrap-reboot", category: "Frontend", desc: "Component architecture, hooks, state management" },
    { name: "Next.js", icon: "bi-triangle-fill", category: "Frontend", desc: "Server-side rendering, routing, modern web apps" },
    { name: "Bootstrap 5", icon: "bi-bootstrap", category: "Frontend", desc: "Responsive grids, UI components, layout design" },
    { name: "Tailwind CSS", icon: "bi-wind", category: "Frontend", desc: "Utility-first styling, responsive UI" },
    { name: "Node.js", icon: "bi-server", category: "Backend & Core", desc: "REST APIs, asynchronous JS server runtimes" },
    { name: "JSON & Databases", icon: "bi-database", category: "Backend & Core", desc: "Structured data storage, document databases" },
    { name: "Git & GitHub", icon: "bi-git", category: "Tools", desc: "Version control, feature branching, collaboration" },
    { name: "Linux / Ubuntu", icon: "bi-ubuntu", category: "Tools", desc: "Command line environment, system logistics" },
  ];

  const filteredSkills = skillsData.filter(s => {
    const matchesCategory = activeCategory === "All" || s.category === activeCategory;
    const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                          s.desc.toLowerCase().includes(searchQuery.toLowerCase());
    return matchesCategory && matchesSearch;
  });

  return (
    <section id="skills">
      <div className="container">
        <div className="section-eyebrow">What I work with</div>
        <h2 className="section-title">Technical Skills</h2>

        <div className="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
          <div className="filter-pills mb-0">
            {categories.map(cat => (
              <button 
                key={cat} 
                className={`filter-btn ${activeCategory === cat ? 'active' : ''}`}
                onClick={() => setActiveCategory(cat)}
                id={`filter-btn-skill-${cat.replace(/\s+/g, '-').toLowerCase()}`}
              >
                {cat}
              </button>
            ))}
          </div>

          <div className="search-input-wrap">
            <i className="bi bi-search search-icon"></i>
            <input 
              type="text" 
              className="search-input" 
              placeholder="Search skills..." 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              id="skill-search-input"
            />
          </div>
        </div>

        <div className="d-flex flex-wrap gap-3">
          {filteredSkills.map(s => (
            <span className="skill-pill" key={s.name} title={s.desc}>
              <span className="skill-dot"></span>

          {filteredSkills.length === 0 && (

}

function Contact({ showToast }) {
  const [formData, setFormData] = useState({ name: '', email: '', message: '' });
  const [errors, setErrors] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  const handleChange = (e) => {
    const { name, value } = e.target;
    setFormData(prev => ({ ...prev, [name]: value }));
    if (errors[name]) {
      setErrors(prev => ({ ...prev, [name]: null }));
    }
  };

  const validate = () => {
    const errs = {};
    if (!formData.name.trim()) errs.name = "Please enter your name.";
    if (!formData.email.trim()) {
      errs.email = "Please enter your email.";
    } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
      errs.email = "Please enter a valid email address.";
    }
    if (!formData.message.trim()) errs.message = "Please enter a message.";
    return errs;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const validationErrors = validate();
    if (Object.keys(validationErrors).length > 0) {
      setErrors(validationErrors);
      return;
    }

    setIsSubmitting(true);
    // Simulate reactive API dispatch
    setTimeout(() => {
      setIsSubmitting(false);
      setSubmitted(true);
      showToast("Thank you! Your message has been sent.");
    }, 800);
  };

  const handleCopyEmail = () => {
    navigator.clipboard.writeText(CONTACT_EMAIL);
    showToast("Email address copied to clipboard!");
  };

  return (
    <section id="contact" className="bg-alt">
      <div className="container">
        <div className="contact-card">
          <h2 className="mb-3">Let's build something together</h2>
          <p className="mb-3">Open to software engineering roles, collaborations, and tech community projects.</p>
          
          <div className="d-flex justify-content-center align-items-center gap-2 mb-4">
            <button className="btn-copy-email" onClick={handleCopyEmail} id="contact-copy-email-btn">
              <i className="bi bi-copy me-2"></i>Copy {CONTACT_EMAIL}
            </button>
          </div>

          {!submitted ? (
            <form className="contact-form" onSubmit={handleSubmit} noValidate id="contact-form">
              <div className="mb-3">
                <label className="form-label text-white small fw-bold">Your Name</label>
                <input 
                  type="text" 
                  name="name" 
                  className="form-control form-control-custom" 
                  placeholder="e.g., Alex Kimani" 
                  value={formData.name}
                  onChange={handleChange}
                  id="contact-name-input"
                />
                {errors.name && <div className="form-error">{errors.name}</div>}
              </div>

              <div className="mb-3">
                <label className="form-label text-white small fw-bold">Your Email Address</label>
                <input 
                  type="email" 
                  name="email" 
                  className="form-control form-control-custom" 
                  placeholder="e.g., alex@example.com" 
                  value={formData.email}
                  onChange={handleChange}
                  id="contact-email-input"
                />
                {errors.email && <div className="form-error">{errors.email}</div>}
              </div>

              <div className="mb-4">
                <label className="form-label text-white small fw-bold">Message</label>
                <textarea 
                  name="message" 
                  rows="4" 
                  className="form-control form-control-custom" 
                  placeholder="Hi Daisy, I'd love to connect regarding..." 
                  value={formData.message}
                  onChange={handleChange}
                  id="contact-message-input"
                ></textarea>
                {errors.message && <div className="form-error">{errors.message}</div>}
              </div>

              <div className="text-center">
                <button type="submit" className="btn btn-contact" disabled={isSubmitting} id="contact-submit-btn">
                  {isSubmitting ? (
                    <span><span className="spinner-border spinner-border-sm me-2" role="status"></span>Sending...</span>
                  ) : (
                    <span><i className="bi bi-send-fill me-2"></i>Send Message</span>
                  )}
                </button>
              </div>
            </form>
          ) : (
            <div className="p-4 rounded bg-white text-dark max-w-500 mx-auto text-center my-4 shadow">
              <i className="bi bi-check-circle-fill text-success display-4 mb-2 d-block"></i>
              <h4 className="fw-bold mb-2">Message Received!</h4>
              <p className="text-secondary small mb-3">Thank you for reaching out. Daisy will get back to you shortly.</p>
              <button className="btn btn-primary-custom btn-sm" onClick={() => { setSubmitted(false); setFormData({name:'', email:'', message:''}); }}>
                Send Another Message
              </button>
            </div>
          )}

          <div className="contact-socials">
            <a href={GITHUB_PROFILE} target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile" id="contact-github-link">
              <i className="bi bi-github"></i>
            </a>
            <a href={LINKEDIN_PROFILE} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Profile" id="contact-linkedin-link">
              <i className="bi bi-linkedin"></i>
            </a>
            <a href={`mailto:${CONTACT_EMAIL}`} aria-label="Direct Email" id="contact-direct-email-link">
              <i className="bi bi-envelope-fill"></i>
            </a>
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  const [darkMode, setDarkMode] = useState(false);
  const [activeSection, setActiveSection] = useState("home");
  const [toastMessage, setToastMessage] = useState(null);
  const [showBackToTop, setShowBackToTop] = useState(false);

  useEffect(() => {
    document.body.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  }, [darkMode]);

  useEffect(() => {
    const handleScroll = () => {
      setShowBackToTop(window.scrollY > 300);

      const sections = ["home", "skills", "experience", "projects", "contact"];
      const scrollPosition = window.scrollY + 200;

      for (let i = sections.length - 1; i >= 0; i--) {
        const el = document.getElementById(sections[i]);
        if (el && el.offsetTop <= scrollPosition) {
          setActiveSection(sections[i]);
          break;
        }
      }
    };

    window.addEventListener("scroll", handleScroll);
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3500);
  };

  const scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <React.Fragment>
      <Navbar 
        darkMode={darkMode} 
        setDarkMode={setDarkMode} 
        activeSection={activeSection} 
      />
      <Hero showToast={showToast} />
      <Skills />
      <Experience />
      <Projects />
      <Contact showToast={showToast} />
      <Footer />

      {showBackToTop && (
        <button 
          className="back-to-top" 
          onClick={scrollToTop}
          aria-label="Back to Top"
          title="Back to top"
          id="back-to-top-btn"
        >
          <i className="bi bi-arrow-up"></i>
        </button>
      )}

      {toastMessage && (
        <div className="toast-custom">
          <i className="bi bi-check-circle-fill text-success"></i>
          <span>{toastMessage}</span>
        </div>
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
